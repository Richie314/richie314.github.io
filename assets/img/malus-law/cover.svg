<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Testing Malus’s law</title>
  <desc id="desc">A beam passes through two polarizers toward a light sensor above a cosine-squared transmission curve.</desc>
  <rect width="800" height="500" rx="24" fill="#f1f5f9"/>
  <text x="48" y="62" font-family="system-ui, sans-serif" font-size="31" font-weight="700" fill="#172554">LIGHT, POLARIZERS &amp; ARDUINO</text>
  <text x="48" y="102" font-family="system-ui, sans-serif" font-size="23" fill="#475569">An investigation of Malus’s law</text>
  <path d="M90 210H710" stroke="#aa4141" stroke-width="8"/>
  <rect x="55" y="187" width="90" height="46" rx="10" fill="#475569"/>
  <circle cx="134" cy="210" r="10" fill="#d97757"/>
  <g stroke="#3268a8" stroke-width="4" fill="#dbeafe" fill-opacity="0.8">
    <ellipse cx="290" cy="210" rx="50" ry="79"/>
    <ellipse cx="495" cy="210" rx="50" ry="79"/>
  </g>
  <path d="M290 147V273M455 160L535 260" stroke="#244f81" stroke-width="6"/>
  <circle cx="707" cy="210" r="28" fill="#dcfce7" stroke="#367650" stroke-width="4"/>
  <path d="M694 196H720L696 205H720L696 214H720L696 223H720" fill="none" stroke="#367650" stroke-width="3"/>
  <g fill="#475569" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle">
    <text x="99" y="310">Laser</text><text x="290" y="310">Fixed polarizer</text><text x="495" y="310">Rotating analyzer</text><text x="707" y="310">LDR</text>
  </g>
  <path d="M75 350V447H720" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M100 434C154 434 185 366 230 366S303 434 350 434 427 366 475 366 551 434 600 434 662 366 704 366" stroke="#3268a8" stroke-width="4" fill="none"/>
  <rect x="315" y="347" width="200" height="44" rx="8" fill="#f1f5f9"/>
  <text x="415" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="27" fill="#172554">I = I₀ cos² θ</text>
</svg>
