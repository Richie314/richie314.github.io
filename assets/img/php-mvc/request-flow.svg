<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img" aria-labelledby="title desc">
  <title id="title">How a request becomes a response</title>
  <desc id="desc">A request reaches the router, then a controller action, then an HTTP response. Application models supply data and rules; views supply HTML.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  </defs>
  <rect x="1" y="1" width="838" height="198" rx="18" fill="#f8fafc" stroke="#d4dce8"/>
  <text x="420" y="31" fill="#263449" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle">One request, a few small responsibilities</text>
  <rect x="24" y="61" width="158" height="80" rx="10" fill="#e8edf5" stroke="#c6d0e0"/>
  <text x="103.0" y="101.0" fill="#263449" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Request</text>
  <text x="103.0" y="124.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle">GET /?name=Ada</text>
  <rect x="227" y="61" width="158" height="80" rx="10" fill="#e6e9ff" stroke="#c6d0e0"/>
  <text x="306.0" y="101.0" fill="#263449" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Router</text>
  <text x="306.0" y="124.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Choose an action</text>
  <rect x="430" y="61" width="158" height="80" rx="10" fill="#d9f2eb" stroke="#c6d0e0"/>
  <text x="509.0" y="101.0" fill="#263449" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Controller</text>
  <text x="509.0" y="124.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Coordinate the work</text>
  <rect x="633" y="61" width="183" height="80" rx="10" fill="#ffedcf" stroke="#c6d0e0"/>
  <text x="724.5" y="101.0" fill="#263449" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Response</text>
  <text x="724.5" y="124.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle">HTML, JSON, or a file</text>
  <path d="M182 101H222" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M385 101H425" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M588 101H628" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="175" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Application models supply data and rules; views supply HTML.</text>

</svg>
