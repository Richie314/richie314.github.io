<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-labelledby="title desc">
  <title id="title">From query fields to PHP arguments</title>
  <desc id="desc">The query first-name=Ada becomes the argument array with key first_name, then the first_name parameter in the action receives Ada.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  </defs>
  <rect x="1" y="1" width="878" height="218" rx="18" fill="#f8fafc" stroke="#d4dce8"/>
  <text x="440" y="32" fill="#263449" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Turn a query field into a named argument</text>
  <rect x="30" y="66" width="240" height="94" rx="10" fill="#e8edf5" stroke="#c6d0e0"/>
  <text x="150.0" y="113.0" fill="#263449" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle">URL query</text>
  <text x="150.0" y="136.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle">first-name=Ada</text>
  <rect x="320" y="66" width="240" height="94" rx="10" fill="#e6e9ff" stroke="#c6d0e0"/>
  <text x="440.0" y="113.0" fill="#263449" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Parsed arguments</text>
  <text x="440.0" y="136.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle">[&#x27;first_name&#x27; =&gt; &#x27;Ada&#x27;]</text>
  <rect x="610" y="66" width="240" height="94" rx="10" fill="#d9f2eb" stroke="#c6d0e0"/>
  <text x="730.0" y="113.0" fill="#263449" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Action parameter</text>
  <text x="730.0" y="136.0" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle">$first_name = &#x27;Ada&#x27;</text>
  <path d="M270 113H314" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M560 113H604" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="193" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle">parse_str() reads the fields; normalization changes hyphens to underscores.</text>

</svg>
