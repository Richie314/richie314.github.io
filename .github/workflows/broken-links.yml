name: Check external links (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check external links 🔗
        uses: lycheeverse/lychee-action@v2
        with:
          # External sites can block bots or rate-limit CI. Report findings
          # on demand without failing the workflow or blocking publication.
          fail: false
          args: >-
            --scheme https --scheme http --max-retries 2 --timeout 30
            --exclude-path README.md --exclude-path _pages/404.md
            --exclude-path _pages/blog.md --exclude-path _posts/
            --verbose --no-progress './**/*.md' './**/*.html'
